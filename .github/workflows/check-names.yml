name: Check river names

# Cross-checks the maps' river and arroyo names against GeoNames, Wikidata
# and the IGN (docs/adr/0016). Runs when the maps or the script change, or by hand.
on:
  workflow_dispatch:
  push:
    paths:
      - src/world/data/**
      - scripts/names/**
      - .github/workflows/check-names.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cross-check names
        run: python3 scripts/names/check_names.py
      - uses: actions/upload-artifact@v4
        with:
          name: names-report
          path: |
            names-report.md
            names-report.json
