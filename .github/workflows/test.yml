name: Build & Type Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Vite production build
        run: npx vite build

      - name: Verify build output
        run: |
          test -f dist/index.html || (echo "Missing index.html" && exit 1)
          test -d dist/assets || (echo "Missing assets dir" && exit 1)
          echo "Build OK — $(du -sh dist | cut -f1) total"
