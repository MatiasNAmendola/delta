name: Probe data sources

# Checks the public sources for river height, tides, weather, rules and
# traffic from GitHub's network (the dev environment can't reach them).
# Runs when the probe script changes, or by hand.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/data/probe-sources.sh
      - .github/workflows/probe-sources.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: bash scripts/data/probe-sources.sh
      - uses: actions/upload-artifact@v4
        with:
          name: probe-summary
          path: summary.txt
