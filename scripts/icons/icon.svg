<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Delta app icon: a varnished lancha colectiva on the brown river at dusk.
       Content kept inside the central 80% so it also works as a maskable icon. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4a3a"/>
      <stop offset="0.55" stop-color="#2f6a52"/>
      <stop offset="1" stop-color="#d9a25a"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a44"/>
      <stop offset="1" stop-color="#4e3a24"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5602c"/>
      <stop offset="1" stop-color="#6b3a18"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- Far island with trees -->
  <path d="M0 292 C60 270 110 262 150 268 C190 250 230 256 262 266 C300 248 350 252 390 266 C430 256 480 262 512 272 L512 312 L0 312 Z" fill="#183a2a"/>
  <rect y="306" width="512" height="206" fill="url(#river)"/>
  <!-- Kelvin wake: the V behind the boat -->
  <path d="M130 352 L20 420 M130 352 L40 470" stroke="#e8dcc4" stroke-opacity="0.35" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M130 356 L60 392" stroke="#f4efe3" stroke-opacity="0.7" stroke-width="7" stroke-linecap="round"/>
  <!-- Hull -->
  <path d="M120 318 L410 318 Q446 318 458 300 L470 300 Q462 352 410 360 L150 360 Q124 360 120 340 Z" fill="url(#hull)"/>
  <rect x="122" y="331" width="330" height="5" fill="#f4efe3" opacity="0.85"/>
  <!-- Cabin with windows and the white roof -->
  <rect x="150" y="262" width="250" height="58" rx="6" fill="#8a4f22"/>
  <g fill="#f4d9a0" opacity="0.9">
    <rect x="164" y="274" width="30" height="22" rx="3"/><rect x="204" y="274" width="30" height="22" rx="3"/>
    <rect x="244" y="274" width="30" height="22" rx="3"/><rect x="284" y="274" width="30" height="22" rx="3"/>
    <rect x="324" y="274" width="30" height="22" rx="3"/><rect x="364" y="274" width="26" height="22" rx="3"/>
  </g>
  <path d="M138 262 L414 262 Q422 262 422 254 L422 248 L130 248 L130 254 Q130 262 138 262 Z" fill="#f4efe3"/>
  <rect x="380" y="226" width="34" height="24" rx="4" fill="#f4efe3"/>
  <!-- Name -->
  <text x="256" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="600" fill="#f4efe3">Delta</text>
  <text x="256" y="208" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" letter-spacing="7" fill="#e9b44c">TIGRE</text>
</svg>
