<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="screen-orientation" content="landscape" />
  <title>Delta · Lancha colectiva</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1a3a2a" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1d18;
      font-family: "Inter Variable", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      touch-action: none;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
      touch-action: none;
    }
    #loadingScreen {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(120% 90% at 30% 20%, #1c3a30 0%, #0d1d18 55%, #08120f 100%);
      color: #f4efe3;
      font-family: "Inter Variable", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #loadingScreen .ld-mark {
      font-family: "Fraunces Variable", Fraunces, "Iowan Old Style", Georgia, serif;
      font-weight: 600; font-size: clamp(56px, 12vw, 120px); letter-spacing: -0.035em; line-height: 0.9;
      animation: ld-rise 1.2s cubic-bezier(.16,1,.3,1) both;
    }
    #loadingScreen .ld-sub {
      font-family: "Fraunces Variable", Fraunces, Georgia, serif; font-style: italic; color: #e9b44c; font-size: clamp(18px, 2.6vw, 26px);
      animation: ld-rise 1.2s 0.12s cubic-bezier(.16,1,.3,1) both;
    }
    /* Progress: a thin river line that fills from the left */
    #loadingScreen .ld-track {
      position: relative; width: min(280px, 60vw); height: 2px; margin-top: 14px;
      background: rgba(244, 239, 227, 0.14); border-radius: 2px; overflow: hidden;
      animation: ld-rise 1.2s 0.2s cubic-bezier(.16,1,.3,1) both;
    }
    #loadingBar {
      position: absolute; inset: 0 auto 0 0; width: 0%;
      background: linear-gradient(90deg, #8a6a43, #e9b44c);
      transition: width 0.5s cubic-bezier(.16,1,.3,1);
    }
    #loadingScreen .ld-track::after {
      content: ""; position: absolute; inset: 0; width: 40%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      animation: ld-shine 1.6s ease-in-out infinite;
    }
    #loadingText {
      font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(244, 239, 227, 0.6);
      animation: ld-rise 1.2s 0.28s cubic-bezier(.16,1,.3,1) both;
    }
    @keyframes ld-rise { from { opacity: 0; transform: translateY(18px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
    @keyframes ld-shine { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) {
      #loadingScreen * { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="loadingScreen">
    <div class="ld-mark">Delta</div>
    <div class="ld-sub">Lancha colectiva</div>
    <div class="ld-track"><div id="loadingBar"></div></div>
    <p id="loadingText">Cargando el río</p>
  </div>
  <canvas id="renderCanvas"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
